<style>

.month { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; margin: 22px 0 6px; }
.foot { margin-top: 36px; color: var(--muted); font-size: 0.82rem; }

<script>
const DATA = /*__DATA__*/null;

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {

}
const pad = n => String(n).padStart(2, '0');
const toDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const isoOf = dt => dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
const TODAY = isoOf(new Date());
const fmt = (iso, opts) => iso ? toDate(iso).toLocaleDateString('en-US', opts || { month: 'short', day: 'numeric', year: 'numeric' }) : '';
const fmtShort = iso => fmt(iso, { month: 'short', day: 'numeric' });
const fmtLong = iso => fmt(iso, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const fmtDay = iso => fmt(iso, { weekday: 'short', month: 'short', day: 'numeric' });
function addDays(iso, n) { const dt = toDate(iso); dt.setDate(dt.getDate() + n); return isoOf(dt); }
function rel(iso) {
  const n = Math.round((toDate(iso) - toDate(TODAY)) / 86400000);
  if (n === 0) return 'today'; if (n === 1) return 'tomorrow'; if (n === -1) return 'yesterday';
  return n > 0 ? 'in ' + n + ' days' : -n + ' days ago';
}
const ext = (text, url, cls) => h('a', { href: url, target: '_blank', rel: 'noopener', class: cls }, text);
const pill = (text, cls) => h('span', { class: 'pill ' + (cls || '') }, text);
const slug = s => String(s).toLowerCase().split(' ')[0];
const TIER = { action: 'Action', watch: 'Watch', none: 'Not relevant' };
const tierPill = t => pill(TIER[t], t);
const IC = 'https://interchange.puc.texas.gov/search/';
const docket = (control, kind) => ext((kind || 'No.') + ' ' + control, IC + 'filings/?ControlNumber=' + control, 'ctl');

const clip = (s, n) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s;

const ACR = new Set('ERCOT PUC PUCT IMM TAC LLC LP IOU AS OM CDR DC TCPA TIEC OPUC TPPA OCSC TCAP NPRR RTC FFSS CCN SOAH II III TDU PGC REP ERS LCRA AEP NRG TEBA LNG OPDM US PFP EOP RFI CY FY CPS STEC TNMP GVEC EDF DCC GRIT OXY TSSA LLDMS PURA'.split(' '));

function sourceLink(src) {
  if (!src) return null;
  if (src.type === 'filing') return ext('Project ' + src.control + ', item ' + src.item, filingUrl(src.control, src.item));

}
function filingLine(f, opts) {

    h('span', { class: 'when' }, fmtShort(f.date)),
    h('div', { class: 'what' },
      ext(clip(tidy(f.description), 170), f.url),
      h('div', { class: 'meta' },
        h('span', { class: 'tag' }, f.kind),
        f.control ? docket(f.control, 'No.') : null,
        h('span', null, clip(tidy(f.party), 60)),

        opts.tier ? tierPill(opts.tier) : null)));

/* ---------- shared state ---------- */
const isUpcoming = m => m.date >= TODAY;

  const stored = localStorage.getItem('imm-watch-last'), prev = localStorage.getItem('imm-watch-prev');
  if (stored && stored < TODAY) { lastVisit = stored; localStorage.setItem('imm-watch-prev', stored); } else if (prev) lastVisit = prev;

const newFilings = DATA.recent_filings.filter(f => f.date > sinceDate);

/* ---------- agenda item ---------- */
function agendaRow(item, meeting) {
  const meta = [];
  if (item.control) meta.push(docket(item.control, item.kind));
  if (item.requested_action) meta.push(h('span', null, 'Posted for: ' + item.requested_action.charAt(0).toLowerCase() + item.requested_action.slice(1)));
  if (item.staff) meta.push(h('span', null, 'Staff: ' + item.staff));
  if (item.outcome) meta.push(h('span', null, h('b', null, item.outcome)));
  if (item.order) meta.push(ext('Order filed ' + fmtShort(item.order.date), item.order.url));
  if (item.deferred_streak && isUpcoming(meeting)) meta.push(h('span', null, 'Not taken up at the last ' + plural(item.deferred_streak, 'meeting')));
  const extras = [];
  if (item.new_filings && item.new_filings.length) extras.push(h('details', null,
    h('summary', null, plural(item.new_filings.length, 'filing') + ' since the previous meeting'),
    h('ul', { class: 'plain' }, item.new_filings.map(f => h('li', null, fmtShort(f.date) + ' · ', ext(clip(tidy(f.description), 120), f.url), ' · ' + clip(tidy(f.party), 40))))));

    h('summary', null, 'IMM filings on record here'),
    h('ul', { class: 'plain' }, item.imm_filings.map(f => h('li', null, fmtShort(f.date) + ', ' + f.date.slice(0, 4) + ' · ', ext(clip(f.description, 120), f.url))))));

    h('span', { class: 'num' }, item.num),
    h('div', { class: 'body' },
      h('div', { class: 'head' }, h('h4', null, item.title), tierPill(item.tier)),
      meta.length ? h('div', { class: 'meta' }, meta) : null,
      h('p', { class: 'why' }, h('span', { class: 'tag' }, item.basis === 'Reviewed' ? 'Why (reviewed) ' : 'Why (auto-sorted) '), item.reason),
      item.summary ? h('p', { class: 'note' }, h('span', { class: 'lab' }, item.note_after ? 'What happened: ' : isUpcoming(meeting) ? 'Where it stands: ' : 'Going in: '), item.summary) : null,

      extras));
}

/* ---------- views ---------- */
const views = {};

views.overview = () => {
  const m = upcoming, c = m.counts, up = isUpcoming(m), nextUp = DATA.next_meeting;

  const actionLine = a => h('div', { class: 'row', style: 'grid-template-columns: minmax(0, 1fr)' }, h('div', { class: 'body' },
    h('div', { class: 'head' }, h('h4', null, a.title), a.status === 'Open' && a.due && a.due < TODAY ? pill('Past due', 'open') : pill(a.status, slug(a.status))),

    h('h2', null, 'This week'),

    h('span', { class: 'when' }, stampOf(e.at)),
    h('div', { class: 'what' }, e.changes.length ? h('ul', { class: 'plain', style: 'margin: 0; font-size: inherit' }, e.changes.map(c => h('li', null, c))) : h('span', { class: 'small' }, 'No changes found'),
      e.sources_ok < e.sources ? h('span', { class: 'small' }, e.sources_ok + ' of ' + e.sources + ' sources reached') : null)))),
  h('h3', { class: 'sub' }, 'What is pulled, what is judgment, what is invented'),
  h('div', { class: 'panel' },
    [['Pulled', 'Agenda items, filing lists, dates, parties, document links, quoted passages, ERCOT revision request status, the IMM’s opinions as recorded in ERCOT’s Board reports, bill histories.'],
     ['Judgment', 'The Action, Watch and Not relevant sort; the reasons; the suggested follow-ups and action items; the stance labels; the recommendation status labels. Reviewed calls were made by reading the filings. Anything new is sorted by keyword rules, kept in a plain file that can be edited, and shown as auto-sorted until a person reviews it.'],
     ['Invented', 'IMM deliverable dates on the calendar, marked Placeholder.']].map(([k, v]) => h('div', { class: 'line' }, h('span', { class: 'when' }, k), h('div', { class: 'what' }, v)))),
  h('h3', { class: 'sub' }, 'Limits'),
  h('div', { class: 'panel' },
    ['Open meetings have video but no transcript. What was said in the room would come from attending or from speech-to-text on the recording.',
     'Action items come only from the public record. The IMM’s own task list, staff requests and contract deliverables are internal.',
     'Stance labels were read from the quoted passages, not from each full document. New filings that mention the IMM show as Not yet read.',
     'The reviewed notes do not update themselves. A new agenda is sorted by the rules until someone reviews it.',
     'Only NPRRs are tracked on the ERCOT side, and only the five most recent PUCT agendas are sorted.'].map(t => h('div', { class: 'line', style: 'grid-template-columns: minmax(0, 1fr)' }, h('div', { class: 'what' }, t)))),
];

/* ---------- shell ---------- */
DATA.memos = DATA.memos || [];
const NAV = [['overview', 'Overview'], ['meetings', 'Open meetings', upcoming.counts.action + upcoming.counts.watch], ['brief', 'Meeting brief'], ['filings', 'Filings and memos', newFilings.length], ['mentions', 'Who cites the IMM', DATA.mentions.length], ['rules', 'ERCOT rule changes', DATA.nprrs.filter(n => n.tier === 'action').length], ['recs', 'Recommendations', DATA.recommendations.recommendations.length], ['calendar', 'Calendar'], ['legislature', 'Legislature'], ['about', 'Sources and method']];
const main = document.getElementById('main'), rail = document.getElementById('rail');
let current = 'overview';
function render(id) {
  const section = h('section', { class: 'view', id: 'view-' + id }, views[id]());
  main.replaceChildren(section);
}
function show(id) {
  if (!views[id]) id = 'overview';
  current = id;
  rail.querySelectorAll('button').forEach(b => { if (b.dataset.view === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  render(id);
  const active = rail.querySelector('[aria-current]');
  if (active && rail.scrollWidth > rail.clientWidth) rail.scrollLeft = active.offsetLeft - rail.offsetLeft - 16;
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* hash is a convenience only */ }
  window.scrollTo(0, 0);
}
NAV.forEach(([id, label, n]) => rail.append(h('button', { type: 'button', 'data-view': id, onclick: () => show(id) }, h('span', null, label), n != null ? h('span', { class: 'count' }, n) : null)));
const stamp = s => { const [d, t] = s.split(' '); const [hh, mm] = t.split(':').map(Number); return fmt(d) + ' at ' + ((hh % 12) || 12) + ':' + pad(mm) + (hh < 12 ? ' a.m.' : ' p.m.'); };
document.getElementById('asof').textContent = 'Public data pulled ' + stamp(DATA.generated);
document.getElementById('disclaimer').textContent = DATA.site.disclaimer;
document.getElementById('foot').textContent = (DATA.site.author ? 'Prepared by ' + DATA.site.author + '. ' : '') + 'An independent demonstration. Not a Potomac Economics, PUCT or ERCOT work product.';
window.addEventListener('hashchange', () => { const id = location.hash.replace('#', ''); if (id && id !== current) show(id); });
show((location.hash || '').replace('#', '') || 'overview');
</script>
